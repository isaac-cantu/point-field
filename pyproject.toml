[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "pointfield"
version = "0.1.0"
description = "Synthetic geometric data generation and geometric learning tools."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Isaac Cantu" }
]

dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py311"